name: cross-platform-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  flutter-release:
    name: ${{ matrix.os }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: windows-x64
          - os: macos-latest
            target: macos
            artifact: macos-universal-source-build
          - os: ubuntu-latest
            target: linux
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/offline_retrieval_ui
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux desktop dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
        working-directory: .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/offline_retrieval_ui/build/${{ matrix.target }}
          if-no-files-found: error
