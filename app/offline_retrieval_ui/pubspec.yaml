name: offline_retrieval_ui
description: "支持无障碍访问、开源合规与发布门禁的离线多模态本地内容检索界面。"
publish_to: 'none'
version: 1.0.0+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: OfflineRetrievalCJK
      fonts:
        - asset: assets/fonts/OfflineRetrievalCJK-Regular.ttf
