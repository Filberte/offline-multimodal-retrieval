[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-multimodal-retrieval"
version = "1.0.0"
description = "Production delivery for accessible offline multimodal local retrieval"
requires-python = ">=3.12"
dependencies = [
  "chromadb>=1.5,<2",
  "numpy>=2,<3",
  "Pillow>=12,<13",
  "pypdf>=6,<7",
  "ai-edge-litert>=2.1,<3",
]

[project.optional-dependencies]
models = [
  "open-clip-torch>=3.3,<4",
  "timm>=1,<2",
  "torch>=2.10,<3",
  "torchvision>=0.25,<1",
  "transformers>=4.57,<5",
]
release = [
  "pyinstaller>=6,<7",
]

[project.scripts]
offline-retrieval = "week4_retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
